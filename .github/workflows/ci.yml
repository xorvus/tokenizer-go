name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Run Tests with Race Detector
        run: go test -race -v ./...

      - name: Run Fuzz Smoke Test
        run: go test -fuzz=FuzzEncodeDecode -fuzztime=5s .
