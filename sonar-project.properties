# SonarQube analysis configuration.
# Analyzed via: sonar-scanner -Dsonar.token=... (or SONAR_TOKEN env).
sonar.projectKey=tokenizer-go
sonar.projectName=tokenizer-go
sonar.sources=.

# Machine-generated regexp2 DFA code (no generator in-repo) is excluded:
# refactoring it by hand would be lossy and pointless. Kept in the build,
# only excluded from analysis.
sonar.exclusions=**/*_test.go,scripts/**,docs/**,internal/bpe/regexp2_codegen_cl100k.go,internal/bpe/regexp2_codegen_o200k.go

sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=report.json
